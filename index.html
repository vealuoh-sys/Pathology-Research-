<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <title>LabResearchAgent</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- OpenAlex Quick Search Widget (Vanilla JS, No React Build Required) -->
    <div id="openalex-widget" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: var(--bg-paper, #fff); border: 1px solid var(--border-color, #e2e8f0); border-radius: 16px; padding: 20px; width: 340px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); font-family: var(--font-sans, sans-serif);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h4 style="margin: 0; font-size: 15px; font-weight: bold; color: var(--text-primary, #0f172a);">OpenAlex Live Search</h4>
        <button onclick="document.getElementById('openalex-widget').style.display='none'" style="background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; line-height: 1;">&times;</button>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input id="oa-search-input" type="text" placeholder="Search publications..." style="flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; background: var(--bg-app); color: var(--text-primary); outline: none;">
        <button id="oa-search-btn" style="background: var(--accent-secondary, #4F46E5); color: white; border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; font-weight: bold; transition: opacity 0.2s;">Search</button>
      </div>
      <div id="oa-results" style="font-size: 13px; color: var(--text-secondary); max-height: 250px; overflow-y: auto;">
        <p style="margin: 0; opacity: 0.7;">Query the global open-access catalog instantly.</p>
      </div>
    </div>

    <script>
      document.getElementById('oa-search-btn').addEventListener('click', async () => {
        const query = document.getElementById('oa-search-input').value;
        const resultsDiv = document.getElementById('oa-results');
        if (!query) return;
        
        resultsDiv.innerHTML = '<p style="margin:0; text-align: center; padding: 20px 0;">Searching OpenAlex...</p>';
        try {
          // Standard fetch request to OpenAlex API
          const res = await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=3`);
          const data = await res.json();
          
          if (data.results && data.results.length > 0) {
            resultsDiv.innerHTML = data.results.map(work => `
              <div style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                <strong style="display: block; color: var(--text-primary); margin-bottom: 6px; font-size: 14px; line-height: 1.3;">${work.title}</strong>
                <span style="font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Published: ${work.publication_year || 'Unknown'}</span>
                ${work.doi ? `<a href="${work.doi}" target="_blank" style="display: inline-block; color: var(--accent-secondary); text-decoration: none; margin-top: 8px; font-weight: bold;">View Paper &rarr;</a>` : ''}
              </div>
            `).join('');
          } else {
            resultsDiv.innerHTML = '<p style="margin:0;">No results found.</p>';
          }
        } catch (err) {
          resultsDiv.innerHTML = '<p style="margin:0; color: var(--status-error);">Error fetching data from OpenAlex.</p>';
        }
      });
      
      // Allow pressing Enter to search
      document.getElementById('oa-search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('oa-search-btn').click();
      });
    </script>
  </body>
</html>
